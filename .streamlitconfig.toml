# Configurazione di Streamlit per Bass Engine. Tenere questa cartella `.streamlit` nella cartella da cui si avvia
# l'app (streamlit run app_V5.py): Streamlit legge la configurazione dalla cartella di lavoro.

[runner]
# OBBLIGATORIO. Con la "magic" attiva Streamlit stampa nella pagina ogni espressione isolata del file: le docstring
# dei Blocchi 1-3 e le righe `requests` / `st` del Blocco 1, cioè l'intera documentazione dei moduli.
magicEnabled = false

[client]
# Sul telefono niente pulsante "Deploy" e menu da sviluppatore.
toolbarMode = "minimal"

[theme]
# Tavolozza unica: stessi valori di B4_UI, B4_COL_BAI e B4_COL_TROPHY nel Blocco 4 (riquadri neri con bordo grigio).
base = "dark"
primaryColor = "#0fa874"
backgroundColor = "#000000"
secondaryBackgroundColor = "#141418"
textColor = "#F2F2F7"
borderColor = "rgba(242, 242, 247, 0.2)"
# Badge e delta colorati (":green-badge", delta_color="violet") con il verde e il viola dei grafici.
greenColor = "#0fa874"
violetColor = "#9C72DE"
dataframeBorderColor = "rgba(242, 242, 247, 0.2)"
dataframeHeaderBackgroundColor = "#141418"
chartCategoricalColors = ["#0fa874", "#9C72DE", "#2b9fe0"]
